<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMMA · ¿Qué tal su montaje?</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--azul:#1e3a8a;--azul2:#2563eb;--verde:#15803d;--rojo:#b91c1c;--muted:#64748b;--borde:#e2e8f0;--fondo:#f1f5f9;--estrella:#f59e0b;}
*{box-sizing:border-box;}
body{margin:0;background:var(--fondo);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;font-size:17px;line-height:1.45;}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px;}
.cab{display:flex;align-items:center;gap:12px;margin:4px 0 14px;}
.cab img{width:46px;height:46px;border-radius:10px;}
.cab .t1{font-weight:800;color:var(--azul);font-size:20px;line-height:1.1;}
.cab .t2{color:var(--muted);font-size:14px;}
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
h1{font-size:21px;margin:0 0 6px;color:var(--azul);}
h2{font-size:17px;margin:18px 0 6px;}
.muted{color:var(--muted);font-size:14px;}
.logo-t{text-align:center;margin:-4px 0 12px;padding-bottom:12px;border-bottom:1px solid var(--borde);}
.logo-t img{max-width:220px;max-height:90px;object-fit:contain;}
.estrellas{display:flex;justify-content:space-between;gap:4px;margin:14px 0 4px;}
.estrellas button{flex:1;background:none;border:0;cursor:pointer;font-size:46px;line-height:1;padding:4px 0;color:#cbd5e1;transition:transform .1s;}
.estrellas button.on{color:var(--estrella);}
.estrellas button:active{transform:scale(1.15);}
.leyenda-est{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);}
#txt_est{text-align:center;font-weight:700;font-size:18px;min-height:26px;margin-top:6px;color:var(--azul);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;}
.chip{font:inherit;padding:9px 14px;border:2px solid var(--borde);background:#fff;border-radius:999px;font-size:15px;cursor:pointer;color:#0f172a;}
.chip.on{border-color:var(--azul2);background:#dbeafe;color:var(--azul);font-weight:700;}
textarea{width:100%;min-height:90px;font:inherit;font-size:16px;padding:10px;border:1px solid #cbd5e1;border-radius:10px;}
.bt{display:block;width:100%;padding:15px 14px;margin:14px 0 0;font:inherit;font-size:18px;font-weight:700;text-align:center;border:0;border-radius:12px;background:var(--azul2);color:#fff;cursor:pointer;}
.bt:disabled{opacity:.45;cursor:default;}
.bt.sec{background:none;color:var(--azul2);font-weight:600;font-size:15px;padding:8px;}
.estado{border-radius:14px;padding:16px;margin-bottom:14px;font-size:17px;}
.estado.ok{background:#dcfce7;border:1px solid #86efac;color:#14532d;}
.estado.aviso{background:#fffbeb;border:1px solid #fcd34d;color:#78350f;}
.estado b.g{font-size:20px;display:block;margin-bottom:4px;}
.est-res{color:var(--estrella);font-size:26px;letter-spacing:2px;}
.pie{text-align:center;color:var(--muted);font-size:14px;margin-top:18px;}
.pie a{color:var(--azul2);font-weight:700;text-decoration:none;}
.demo{background:#fef3c7;color:#78350f;border:1px dashed #f59e0b;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:12px;}
.demo a{color:#92400e;margin-right:8px;}
</style>
</head>
<body>
<main id="app"><p class="muted">Cargando…</p></main>
<script>
/* ALMMA · Página PÚBLICA (sin sesión) para que el cliente final valore el montaje (27-11-2026, migracion/151_valoraciones.sql).
   Le llega por WhatsApp desde la pantalla Valoraciones (valoraciones.html). El enlace lleva un código imposible de adivinar (?v=<uuid>).
   Solo usa dos funciones pensadas para «anon»: valoracion_publica(p_token) y responder_valoracion(...).
   Se puede cambiar la respuesta durante 2 días. ?demo=1 (o demo=hecha) = PRUEBA con datos inventados: no se guarda nada. */
const params = new URLSearchParams(location.search);
const token = params.get("v"), demo = params.get("demo");
const TEL = "613 037 899", TEL_LINK = "tel:+34613037899";
const client = demo ? null : supabase.createClient("https://uamgbtbsxbrgymhqalak.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWdidGJzeGJyZ3ltaHFhbGFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTMyOTIsImV4cCI6MjA5OTg4OTI5Mn0.0OClM8yZmfkiXynOkGLQiLRX-XZjkkP63z5UfIgck8k");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const app = document.getElementById("app");
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const fLarga = f => { const d = new Date(f + "T12:00:00"); return DIAS[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()]; };
const TEXTO_EST = ["", "Muy mal", "Mal", "Regular", "Bien", "¡Muy bien!"];
const BUENO = ["Puntualidad", "Amabilidad", "Limpieza", "Rapidez", "Montaje bien acabado", "Nos explicaron todo"];
const MALO = ["Puntualidad", "Trato", "Limpieza", "Montaje mal acabado", "Faltaban piezas", "Daños en la casa", "Tardaron mucho"];
const logoOk = s => typeof s === "string" && /^data:image\/(png|jpe?g|webp);base64,/.test(s);   // como en cita.html: nada de SVG

let V = null, est = 0, elegidos = new Set(), comentario = "", editando = false, enviando = false;

function datosDemo() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  const base = { valida: true, nombre: "María", tienda: "Muebles Ejemplo", fecha: d.toISOString().slice(0, 10), articulos: ["Armario 3 puertas", "Cama 150 con canapé"],
    respondida: false, puede_cambiar: true, puntuacion: null, aspectos: null, comentario: null };
  if (demo === "hecha") Object.assign(base, { respondida: true, puntuacion: 5, aspectos: ["Puntualidad", "Limpieza"], comentario: "Muy majos y todo perfecto." });
  return base;
}
async function cargar() {
  if (demo) { V = datosDemo(); return pintar(); }
  if (!token) return pintarError("Este enlace no es correcto. Revise que lo ha abierto entero desde el mensaje de WhatsApp.");
  const { data, error } = await client.rpc("valoracion_publica", { p_token: token });
  if (error) return pintarError("No hemos podido cargar la página ahora mismo. Pruebe de nuevo en un rato.");
  if (!data) return pintarError("Este enlace no es válido.");
  V = data; pintar();
}
function cabecera() {
  return (demo ? '<div class="demo"><b>PRUEBA</b> con datos inventados: no se guarda nada. Ver: <a href="?demo=1">sin responder</a><a href="?demo=hecha">ya respondida</a></div>' : "") +
    '<div class="cab"><img src="icon-192.png" alt=""><div><div class="t1">ALMMA</div><div class="t2">Entregas y montajes' + (V && V.tienda ? " · " + esc(V.tienda) : "") + "</div></div></div>";
}
function pie() { return '<div class="pie">¿Algo urgente? Llámenos al <a href="' + TEL_LINK + '">📞 ' + TEL + "</a></div>"; }
function pintarError(txt) { app.innerHTML = cabecera() + '<div class="estado aviso"><b class="g">⚠ ' + esc(txt) + "</b></div>" + pie(); }
const estrellasTxt = n => "★".repeat(n) + "☆".repeat(5 - n);

function pintar() {
  if (!V.valida) {
    const m = { sin_montar: "Todavía no consta el montaje de este pedido. Cuando esté hecho, podrá valorarlo aquí.", caducada: "Este enlace ha caducado. ¡Gracias de todas formas!" };
    return pintarError(m[V.motivo] || "Este enlace ya no está disponible.");
  }
  let h = cabecera() + '<div class="tarjeta">' + (logoOk(V.logo) ? '<div class="logo-t"><img src="' + esc(V.logo) + '" alt="' + esc(V.tienda || "Tienda") + '"></div>' : "");
  if (V.respondida && !editando) {
    h += "<h1>¡Muchas gracias" + (V.nombre ? ", " + esc(V.nombre) : "") + "!</h1>" +
      '<div class="estado ok" style="margin:12px 0 0"><b class="g">Hemos recibido su valoración</b><div class="est-res">' + estrellasTxt(V.puntuacion) + "</div>" +
      (V.aspectos && V.aspectos.length ? "<div>" + V.aspectos.map(esc).join(" · ") + "</div>" : "") +
      (V.comentario ? '<div style="margin-top:6px">«' + esc(V.comentario) + "»</div>" : "") + "</div>" +
      (V.puntuacion <= 2 ? '<p class="muted" style="margin-top:12px">Sentimos mucho que no haya ido bien. Lo revisamos y le llamaremos si hace falta.</p>' : "") +
      (V.puede_cambiar ? '<button class="bt sec" onclick="cambiar()">Cambiar mi valoración</button>' : "") + "</div>";
    app.innerHTML = h + pie(); return;
  }
  h += "<h1>" + (V.nombre ? "Hola, " + esc(V.nombre) : "Hola") + "</h1>" +
    '<div>¿Qué tal fue el montaje' + (V.fecha ? " del <b>" + fLarga(V.fecha) + "</b>" : "") + (V.tienda ? " (pedido de <b>" + esc(V.tienda) + "</b>)" : "") + "?</div>" +
    (V.articulos && V.articulos.length ? '<div class="muted" style="margin-top:6px">📦 ' + V.articulos.slice(0, 3).map(esc).join(", ") + (V.articulos.length > 3 ? "…" : "") + "</div>" : "") +
    '<div class="estrellas" role="radiogroup" aria-label="Puntuación de 1 a 5">' +
    [1, 2, 3, 4, 5].map(n => '<button type="button" role="radio" aria-checked="' + (est === n) + '" aria-label="' + n + " de 5: " + TEXTO_EST[n] + '" class="' + (n <= est ? "on" : "") + '" onclick="ponerEst(' + n + ')">★</button>').join("") +
    '</div><div class="leyenda-est"><span>Muy mal</span><span>Muy bien</span></div><div id="txt_est">' + (est ? TEXTO_EST[est] : "Toque una estrella") + "</div>";
  if (est) {
    const lista = est >= 4 ? BUENO : MALO;
    h += "<h2>" + (est >= 4 ? "¿Qué destacaría? <span class=\"muted\">(opcional)</span>" : "¿Qué podemos mejorar?") + '</h2><div class="chips">' +
      lista.map(c => '<button type="button" class="chip' + (elegidos.has(c) ? " on" : "") + '" onclick="alternar(this, \'' + c.replace(/'/g, "") + '\')">' + esc(c) + "</button>").join("") + "</div>" +
      '<h2>Comentario <span class="muted">(opcional)</span></h2><textarea id="com" maxlength="1000" placeholder="' + (est >= 4 ? "Lo que quiera contarnos…" : "Cuéntenos qué pasó y lo revisamos…") + '" oninput="comentario=this.value">' + esc(comentario) + "</textarea>";
  }
  h += '<button class="bt" id="enviar" ' + (est && !enviando ? "" : "disabled") + ' onclick="enviar()">' + (enviando ? "Enviando…" : "Enviar valoración") + "</button>" +
    (editando ? '<button class="bt sec" onclick="editando=false;pintar()">No cambiar</button>' : "") + "</div>";
  app.innerHTML = h + pie();
}
function ponerEst(n) {
  if ((est >= 4) !== (n >= 4)) elegidos.clear();   // cambia de «lo bueno» a «lo malo»: las opciones son otras
  est = n; pintar();
}
function alternar(b, c) { elegidos.has(c) ? elegidos.delete(c) : elegidos.add(c); b.classList.toggle("on"); }
function cambiar() { editando = true; est = V.puntuacion || 0; elegidos = new Set(V.aspectos || []); comentario = V.comentario || ""; pintar(); }
async function enviar() {
  if (!est || enviando) return;
  const com = (document.getElementById("com") || {}).value || "";
  enviando = true; pintar();
  if (demo) { Object.assign(V, { respondida: true, puntuacion: est, aspectos: [...elegidos], comentario: com.trim() || null }); enviando = false; editando = false; return pintar(); }
  const { data, error } = await client.rpc("responder_valoracion", { p_token: token, p_puntuacion: est, p_aspectos: [...elegidos], p_comentario: com || null });
  enviando = false;
  if (error || !data) { pintar(); alert("No se ha podido enviar. Pruebe de nuevo en un momento."); return; }
  V = data; editando = false; pintar();
}
cargar();
</script>
</body>
</html>
