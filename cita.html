<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALMMA · Su cita de montaje</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--azul:#1e3a8a;--azul2:#2563eb;--verde:#15803d;--rojo:#b91c1c;--ambar:#b45309;--muted:#64748b;--borde:#e2e8f0;--fondo:#f1f5f9;}
*{box-sizing:border-box;}
body{margin:0;background:var(--fondo);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;font-size:17px;line-height:1.45;}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px;}
.cab{display:flex;align-items:center;gap:12px;margin:4px 0 14px;}
.cab img{width:46px;height:46px;border-radius:10px;}
.cab .t1{font-weight:800;color:var(--azul);font-size:20px;line-height:1.1;}
.cab .t2{color:var(--muted);font-size:14px;}
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
h1{font-size:21px;margin:0 0 10px;color:var(--azul);}
.dato{display:flex;gap:10px;align-items:flex-start;margin:8px 0;}
.dato .ic{font-size:22px;width:28px;text-align:center;flex:none;}
.dato b{font-size:18px;}
.muted{color:var(--muted);font-size:14px;}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;}
.bt{display:block;width:100%;padding:15px 14px;margin:10px 0;font-size:18px;font-weight:700;text-align:left;}
.bt small{display:block;font-weight:400;font-size:14px;opacity:.85;}
.bt.si{background:var(--verde);color:#fff;}
.bt.no{background:#fff;color:var(--rojo);border:2px solid #fca5a5;}
.bt.nota{background:#fff;color:var(--azul);border:2px solid #bfdbfe;}
.bt.enviar{background:var(--azul2);color:#fff;text-align:center;}
.bt.volver{background:none;color:var(--muted);font-weight:400;font-size:15px;text-align:center;padding:8px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
.chip{padding:9px 14px;border:2px solid var(--borde);background:#fff;border-radius:999px;font-size:15px;}
.chip.on{border-color:var(--azul2);background:#dbeafe;color:var(--azul);font-weight:700;}
textarea{width:100%;min-height:90px;font:inherit;font-size:16px;padding:10px;border:1px solid #cbd5e1;border-radius:10px;}
label.tit{display:block;font-weight:700;margin:10px 0 4px;}
.estado{border-radius:14px;padding:16px;margin-bottom:14px;font-size:17px;}
.estado.ok{background:#dcfce7;border:1px solid #86efac;color:#14532d;}
.estado.no{background:#fef2f2;border:1px solid #fca5a5;color:#7f1d1d;}
.estado.nota{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;}
.estado.aviso{background:#fffbeb;border:1px solid #fcd34d;color:#78350f;}
.estado b.g{font-size:20px;display:block;margin-bottom:4px;}
ul.cosas{margin:6px 0 0;padding-left:20px;}
.pie{text-align:center;color:var(--muted);font-size:14px;margin-top:18px;}
.pie a{color:var(--azul2);font-weight:700;text-decoration:none;}
.demo{background:#fef3c7;color:#78350f;border:1px dashed #f59e0b;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:12px;}
.demo a{color:#92400e;margin-right:8px;}
.oculto{display:none;}
.logo-t{text-align:center;margin:-4px 0 12px;padding-bottom:12px;border-bottom:1px solid var(--borde);}
.logo-t img{max-width:220px;max-height:90px;object-fit:contain;}
</style>
</head>
<body>
<main id="app"><p class="muted">Cargando su cita…</p></main>

<script>
/* Página PÚBLICA (sin sesión) para que el cliente final responda a la cita de montaje que le llega por WhatsApp.
   El enlace lleva un código imposible de adivinar (?c=<uuid>), no el número de orden.
   Solo usa dos funciones de la base de datos, pensadas para «anon»: cita_publica(p_token) y responder_cita(...).
   No se enseña la dirección completa ni el teléfono: solo la población.
   ?demo=1 (o demo=confirmada / demo=cambiada) = PRUEBA con datos inventados: no se conecta a la base de datos. */
const params = new URLSearchParams(location.search);
const token = params.get("c"), demo = params.get("demo");
const TEL = "613 037 899", TEL_LINK = "tel:+34613037899";
const client = demo ? null : supabase.createClient("https://uamgbtbsxbrgymhqalak.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhbWdidGJzeGJyZ3ltaHFhbGFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTMyOTIsImV4cCI6MjA5OTg4OTI5Mn0.0OClM8yZmfkiXynOkGLQiLRX-XZjkkP63z5UfIgck8k");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const app = document.getElementById("app");
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
function fLarga(f){ const d = new Date(f + "T12:00:00"); const s = DIAS[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()]; return s[0].toUpperCase() + s.slice(1); }
const frH = m => Math.floor(m / 60) + (m % 60 ? ":" + String(m % 60).padStart(2, "0") : "");
const franja = c => "De " + frH(c.franja_desde) + " a " + frH(c.franja_desde + (c.franja_min || 120)) + " h";
const fHora = ts => new Date(ts).toLocaleString("es-ES", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

/* ---------- datos de PRUEBA (inventados) ---------- */
function logoDemo(){   // un logo inventado, dibujado aquí mismo
  const cv = document.createElement("canvas"); cv.width = 360; cv.height = 110; const g = cv.getContext("2d");
  g.fillStyle = "#7c2d12"; g.beginPath(); g.arc(55, 55, 42, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.font = "bold 44px Georgia"; g.fillText("M", 38, 70);
  g.fillStyle = "#7c2d12"; g.font = "bold 34px Georgia"; g.fillText("Muebles", 112, 52);
  g.fillStyle = "#a16207"; g.font = "24px Georgia"; g.fillText("EJEMPLO", 114, 84);
  return cv.toDataURL("image/png");
}
function citaDemo(){
  const d = new Date(); d.setDate(d.getDate() + 2); if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  const base = { valida: true, estado: "avisada", fecha: d.toISOString().slice(0, 10), franja_desde: 600, franja_min: 120,
    nombre: "María", tienda: "Muebles Ejemplo", localidad: "Paterna",
    articulos: ["Armario 3 puertas", "Cama 150 con canapé", "Mesita de noche (2)"], respuesta: null, logo: logoDemo() };
  if (demo === "confirmada") Object.assign(base, { respuesta: "si", respondido_at: new Date().toISOString() });
  if (demo === "cambiada") Object.assign(base, { valida: false, motivo: "cambiada" });
  return base;
}

let cita = null, modo = "inicio", elegidos = new Set();

async function cargar(){
  if (demo) { cita = citaDemo(); return pintar(); }
  if (!token) return pintarError("Este enlace no es correcto. Revise que lo ha abierto entero desde el mensaje de WhatsApp.");
  const { data, error } = await client.rpc("cita_publica", { p_token: token });
  if (error) return pintarError("No hemos podido cargar su cita ahora mismo. Pruebe de nuevo en un rato.");
  if (!data) return pintarError("Este enlace no es válido o ha caducado.");
  cita = data; pintar();
}

function cabecera(){
  return (demo ? '<div class="demo"><b>PRUEBA</b> con datos inventados: no se guarda nada. Ver: <a href="?demo=1">sin responder</a><a href="?demo=confirmada">ya confirmada</a><a href="?demo=cambiada">cita cambiada</a></div>' : "") +
    '<div class="cab"><img src="icon-192.png" alt=""><div><div class="t1">ALMMA</div><div class="t2">Entregas y montajes' + (cita && cita.tienda ? " · " + esc(cita.tienda) : "") + '</div></div></div>';
}
function pie(){ return '<div class="pie">¿Dudas? Llámenos al <a href="' + TEL_LINK + '">📞 ' + TEL + '</a></div>'; }
function pintarError(txt){ app.innerHTML = cabecera() + '<div class="estado aviso"><b class="g">⚠ ' + esc(txt) + '</b></div>' + pie(); }

const logoOk = s => typeof s === "string" && /^data:image\/(png|jpe?g|webp);base64,/.test(s);   // como en tienda.html (SQL 107): nada de SVG
// como en el WhatsApp: hasta 3 artículos, todos; más, los 2 primeros y «y otros artículos», SIN número (un pedido puede venir
// desglosado en muchas líneas y el cliente creería que no es el suyo)
function resumenArticulos(a){
  if (a.length <= 3) return a.map(esc).join("<br>");
  return a.slice(0, 2).map(esc).join("<br>") + '<br><span class="muted">y otros artículos</span>';
}
function bloqueCita(){
  return '<div class="tarjeta">' + (logoOk(cita.logo) ? '<div class="logo-t"><img src="' + esc(cita.logo) + '" alt="' + esc(cita.tienda || "Tienda") + '"></div>' : "") + '<h1>' + (cita.nombre ? "Hola, " + esc(cita.nombre) : "Su cita de montaje") + '</h1>' +
    '<div class="muted">Tenemos previsto instalar su pedido' + (cita.tienda ? " de <b>" + esc(cita.tienda) + "</b>" : "") + ':</div>' +
    '<div class="dato"><span class="ic">📅</span><div><b>' + fLarga(cita.fecha) + '</b></div></div>' +
    '<div class="dato"><span class="ic">🕘</span><div><b>' + franja(cita) + '</b><div class="muted">Hora de llegada aproximada</div></div></div>' +
    (cita.localidad ? '<div class="dato"><span class="ic">📍</span><div>' + esc(cita.localidad) + '</div></div>' : "") +
    (cita.articulos && cita.articulos.length ? '<div class="dato"><span class="ic">📦</span><div>' + resumenArticulos(cita.articulos) + '</div></div>' : "") +
    '</div>';
}

function bloqueRespuesta(){
  const nota = cita.nota ? '<div class="estado nota"><b class="g">💬 Hemos recibido su aviso</b>«' + esc(cita.nota) + '»' + (cita.nota_at ? '<div class="muted">Enviado el ' + fHora(cita.nota_at) + '</div>' : "") + '</div>' : "";
  return siNo() + nota;
}
function siNo(){
  const r = cita.respuesta; if (!r) return "";
  const cuando = cita.respondido_at ? '<div class="muted">Respondió el ' + fHora(cita.respondido_at) + '</div>' : "";
  if (r === "si") return '<div class="estado ok"><b class="g">✅ Cita confirmada</b>Iremos a la dirección indicada el ' + fLarga(cita.fecha).toLowerCase() + ', ' + franja(cita).toLowerCase() + ' (hora aproximada). ¡Gracias!' + cuando + '</div>';
  if (r === "no") return '<div class="estado no"><b class="g">📆 Nos ha dicho que no le va bien</b>Le escribiremos con otro día.' + (cita.preferencia ? '<div style="margin-top:6px">Prefiere: <b>' + esc(cita.preferencia) + '</b></div>' : "") + (cita.comentario ? '<div>«' + esc(cita.comentario) + '»</div>' : "") + cuando + '</div>';
  return "";
}

const OPC_DIA = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"], OPC_HORA = ["Por la mañana", "Por la tarde", "Me da igual la hora"];
// Tras el «Sí» (Arturo, 26-11-2026): preguntar si hay algo del acceso que debamos saber, agradecer y cerrar; la oficina confirma luego por WhatsApp
const OPC_ACCESO = ["Ascensor pequeño", "Sin ascensor", "Escalera estrecha", "Calle estrecha", "Calle peatonal", "Difícil aparcar", "Llamar antes de llegar"];

function pintar(){
  if (modo === "gracias") {
    app.innerHTML = cabecera() + '<div class="estado ok"><b class="g">🙏 ¡Muchas gracias' + (cita.nombre ? ", " + esc(cita.nombre) : "") + '!</b>' +
      'Su cita queda confirmada para el <b>' + fLarga(cita.fecha).toLowerCase() + '</b>, ' + franja(cita).toLowerCase() + ' (hora aproximada).' +
      (cita.nota ? '<div style="margin-top:6px">Hemos tomado nota: «' + esc(cita.nota) + '»</div>' : "") +
      '<div style="margin-top:10px">En breve le enviaremos un <b>WhatsApp</b> confirmándole la cita.</div></div>' +
      '<div class="tarjeta" style="text-align:center"><b>Ya puede cerrar esta pantalla.</b>' +
      '<button class="bt enviar" onclick="cerrarPantalla()">Cerrar</button><div id="no_cierra" class="muted oculto">Si no se cierra sola, pulse la ✕ de arriba o el botón de volver del móvil.</div></div>' + pie();
    return;
  }
  if (!cita.valida) {
    app.innerHTML = cabecera() + '<div class="estado aviso"><b class="g">Esta cita ha cambiado</b>' +
      (cita.motivo === "realizada" ? "El montaje ya se ha realizado. ¡Gracias por confiar en nosotros!" : "Le enviaremos un nuevo mensaje con la fecha. Si tiene dudas, llámenos.") + '</div>' + pie();
    return;
  }
  let h = cabecera() + bloqueRespuesta() + bloqueCita();
  if (modo === "inicio") {
    h += '<div class="tarjeta"><b>' + (cita.respuesta === "si" ? "¿Algo más?" : cita.respuesta ? "¿Quiere cambiar su respuesta?" : "¿Le va bien este día?") + '</b>' +
      (cita.respuesta !== "si" ? '<button class="bt si" onclick="responder(\'si\')">✅ Sí, me va bien<small>Confirmo el día y la hora</small></button>' : "") +
      (cita.respuesta !== "no" ? '<button class="bt no" onclick="ir(\'no\')">📆 No me va bien<small>Prefiero otro día u otra hora</small></button>' : "") +
      '<button class="bt nota" onclick="ir(\'nota\')">💬 ' + (cita.nota ? "Avisar de otra cosa" : "Quiero avisar de algo") + '<small>Sin ascensor, acceso difícil, que me llamen antes…</small></button></div>' +
      '<div class="tarjeta muted"><b style="color:#0f172a">Para que todo vaya bien</b><ul class="cosas"><li>Tiene que haber una persona mayor de edad en casa.</li><li>Deje despejada la zona donde se va a montar.</li><li>Si no hay ascensor o el acceso es complicado, avísenos.</li></ul></div>';
  } else if (modo === "no") {
    h += '<div class="tarjeta"><b>¿Qué le vendría mejor?</b><div class="muted">Marque lo que quiera (puede marcar varios).</div>' +
      '<label class="tit">Días</label><div class="chips">' + OPC_DIA.map(chip).join("") + '</div>' +
      '<label class="tit">Hora</label><div class="chips">' + OPC_HORA.map(chip).join("") + '</div>' +
      '<label class="tit" for="txt">¿Algo más? (opcional)</label><textarea id="txt" maxlength="500" placeholder="Por ejemplo: a partir del día 10, o solo por las tardes"></textarea>' +
      '<button class="bt enviar" onclick="responder(\'no\')">Enviar</button><button class="bt volver" onclick="ir(\'inicio\')">← Volver</button></div>';
  } else if (modo === "nota") {
    h += '<div class="tarjeta"><label class="tit" for="txt">Escríbanos lo que necesitemos saber</label>' +
      '<textarea id="txt" maxlength="500" placeholder="Por ejemplo: es un 4º sin ascensor; llamen al llegar"></textarea>' +
      '<button class="bt enviar" onclick="responder(\'nota\')">Enviar</button><button class="bt volver" onclick="ir(\'inicio\')">← Volver</button></div>';
  } else if (modo === "acceso") {
    h = cabecera() + '<div class="estado ok"><b class="g">✅ Cita confirmada</b>' + fLarga(cita.fecha) + ', ' + franja(cita).toLowerCase() + ' (hora aproximada).</div>' +
      '<div class="tarjeta"><b>¿Tiene algo que indicarnos?</b><div class="muted">Para llegar y subir los muebles sin problemas. Marque lo que corresponda (puede marcar varios).</div>' +
      '<div class="chips" style="margin-top:12px">' + OPC_ACCESO.map(chip).join("") + '</div>' +
      '<label class="tit" for="txt">¿Algo más? (opcional)</label><textarea id="txt" maxlength="400" placeholder="Por ejemplo: es un 4º piso; la calle es de un solo sentido; hay que pedir llave del garaje"></textarea>' +
      '<button class="bt enviar" onclick="responder(\'acceso\')">Enviar</button>' +
      '<button class="bt nota" style="text-align:center" onclick="ir(\'gracias\')">No, nada que indicar</button></div>';
  }
  app.innerHTML = h + pie();
}
function cerrarPantalla(){
  window.close();   // solo funciona si el navegador lo permite (p. ej. abierta desde WhatsApp en algunas versiones)
  setTimeout(() => { const n = document.getElementById("no_cierra"); if (n) n.classList.remove("oculto"); }, 400);
}
function chip(t){ return '<button class="chip ' + (elegidos.has(t) ? "on" : "") + '" onclick="marcar(this, \'' + t + '\')">' + t + '</button>'; }
function marcar(b, t){ elegidos.has(t) ? elegidos.delete(t) : elegidos.add(t); b.classList.toggle("on"); }
function ir(m){ modo = m; elegidos.clear(); pintar(); window.scrollTo(0, 0); }

let enviando = false;
async function responder(r){
  if (enviando) return;
  let txt = (document.getElementById("txt")?.value || "").trim();
  if (r === "nota" && !txt) { alert("Escriba el aviso antes de enviarlo."); return; }
  if (r === "acceso") {   // lo marcado + lo escrito, como un aviso más («nota»)
    txt = [...OPC_ACCESO.filter(t => elegidos.has(t)), txt].filter(Boolean).join(" · ");
    if (!txt) { ir("gracias"); return; }   // no ha marcado ni escrito nada = nada que indicar
  }
  const rpc = r === "acceso" ? "nota" : r;
  const preferencia = r === "no" ? [...elegidos].join(", ") : null;
  // después del «Sí» se pregunta por el acceso; después del aviso del acceso, gracias y cerrar
  const siguiente = r === "si" ? "acceso" : r === "acceso" ? "gracias" : "inicio";
  enviando = true;
  try {
    if (demo) await new Promise(x => setTimeout(x, 400));
    else {
      const { data, error } = await client.rpc("responder_cita", { p_token: token, p_respuesta: rpc, p_preferencia: preferencia, p_comentario: txt || null });
      if (error) throw error;
      if (!data) throw new Error("sin datos");
      cita = data; ir(data.valida ? siguiente : "inicio"); return;   // la base de datos devuelve la cita ya actualizada
    }
    if (rpc === "nota") Object.assign(cita, { nota: txt, nota_at: new Date().toISOString() });   // un aviso no cambia el sí / no
    else Object.assign(cita, { respuesta: r, preferencia, comentario: txt || null, respondido_at: new Date().toISOString() });
    ir(siguiente);
  } catch (e) {
    alert("No se ha podido enviar. Compruebe que tiene internet y pruebe otra vez, o llámenos al " + TEL + ".");
  } finally { enviando = false; }
}
cargar();
</script>
</body>
</html>
